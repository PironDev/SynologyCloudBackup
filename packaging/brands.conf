# Параметры вендорских пакетов. Формат: ключ=значение, секции [бренд].
# Используется packaging/build.sh.

[yadisk]
cmd=yadisk
pkg=YaDiskBackup
bin=yadisk-backup
display=Яндекс.Диск
desc=Автоматическая выгрузка бэкапов, файлов и архивов с Synology на Яндекс.Диск через официальный REST API. Несколько аккаунтов, расписание, веб-интерфейс, доступ из File Station через WebDAV-шлюз.
web_port=8765
gw_port=8766
proxy_port=8767
c1=FF8A5C
c2=E5391B
appid=SYNO.SDS.YaDiskBackup.Application
en_title=Yandex.Disk web interface
en_desc=Yandex.Disk backup package: web interface (tab mode)

[mailru]
cmd=mailru
pkg=MailRuCloudBackup
bin=mailru-backup
display=Облако Mail.ru
desc=Автоматическая выгрузка бэкапов, файлов и архивов с Synology в Облако Mail.ru (WebDAV, пароль внешнего приложения). Несколько аккаунтов, расписание, веб-интерфейс, доступ из File Station через WebDAV-шлюз.
web_port=8775
gw_port=8776
proxy_port=8777
c1=4DA3FF
c2=0B5FD6
appid=SYNO.SDS.MailRuCloudBackup.Application
en_title=Mail.ru Cloud web interface
en_desc=Mail.ru Cloud backup package: web interface (tab mode)
