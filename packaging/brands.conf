# Параметры пакета. Формат: ключ=значение, секции [бренд].
# Используется packaging/build.sh. Один пакет содержит все провайдеры (см. cmd/cloudbackup).

[cloudbackup]
cmd=cloudbackup
pkg=CloudBackup
bin=cloudbackup
display=CloudBackup
desc=Автоматическая выгрузка бэкапов, файлов и архивов с Synology в Яндекс.Диск, Облако Mail.ru, Amazon S3, Backblaze B2, Google Drive, Dropbox, OneDrive, Box и pCloud. Несколько аккаунтов разных облаков, расписание, сводка по всем аккаунтам, веб-интерфейс, доступ из File Station через WebDAV-шлюз.
web_port=8765
gw_port=8766
proxy_port=8767
c1=3A8DDE
c2=1A4FA0
appid=SYNO.SDS.CloudBackup.Application
en_title=CloudBackup web interface
en_desc=CloudBackup package: web interface (tab mode)
