name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Формат
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Тесты
        run: go test -race ./...
      - name: Синтаксис скриптов
        run: |
          bash -n packaging/build.sh
          for f in internal/web/static/*.js; do node --check "$f"; done

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Сборка SPK без подписи
        run: packaging/build.sh 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: spk-ci
          path: dist/*.spk
