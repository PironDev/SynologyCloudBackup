name: ci

# Исходники лежат в приватном сабмодуле app/ (PironDev/SynologyCloudBackup-src).
# Для его загрузки нужен секрет SUBMODULE_TOKEN — fine-grained PAT с правом
# Contents: Read-only только на репозиторий SynologyCloudBackup-src.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    # PR из форков не получают секретов — приватный сабмодуль им недоступен.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Проверка секрета SUBMODULE_TOKEN
        working-directory: .
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          if [ -z "$SUBMODULE_TOKEN" ]; then
            echo "::error::Не задан секрет SUBMODULE_TOKEN (PAT с доступом на чтение к PironDev/SynologyCloudBackup-src)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Формат
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Тесты
        run: go test -race ./...
      - name: Синтаксис скриптов
        run: |
          bash -n packaging/build.sh
          for f in internal/web/static/*.js; do node --check "$f"; done

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Сборка SPK без подписи
        run: packaging/build.sh 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: spk-ci
          path: app/dist/*.spk
          if-no-files-found: error
